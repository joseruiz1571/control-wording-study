version: "0.1.0"
description: "Control-wording study variant AC-2(7).v1"
controls:
  - id: "AC-2(7).v1"
    framework: "SP 800-53 Rev 5"
    pattern: synthesis
    intent: >
      (a) Set up and administer privileged user accounts in accordance with [Selection: a role-based access scheme; an attribute-based access scheme]; (b) Monitor assignments of privileged roles or attributes; (c) Monitor changes to roles or attributes; and (d) Revoke access when privileged role or attribute assignments are no longer appropriate.
    collectors:
      - getEndpointExecutionRole
      - getCloudTrailEvents
