version: "0.1.0"
description: "Control-wording study variant AC-2(7).v2"
controls:
  - id: "AC-2(7).v2"
    framework: "SP 800-53 Rev 5"
    pattern: synthesis
    intent: >
      Privileged user accounts are established and administered in accordance with [Selection: a role-based access scheme; an attribute-based access scheme]; privileged role or attribute assignments are monitored; changes to roles or attributes are monitored; and access is revoked when privileged role or attribute assignments are no longer appropriate.
    collectors:
      - getEndpointExecutionRole
      - getCloudTrailEvents
