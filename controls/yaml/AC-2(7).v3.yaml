version: "0.1.0"
description: "Control-wording study variant AC-2(7).v3"
controls:
  - id: "AC-2(7).v3"
    framework: "SP 800-53 Rev 5"
    pattern: synthesis
    intent: >
      (a) In accordance with [Selection: a role-based access scheme; an attribute-based access scheme], establish and administer privileged user accounts; (b) Watch privileged role or attribute assignments; (c) Watch changes to roles or attributes; and (d) Take away access when privileged role or attribute assignments are no longer appropriate.
    collectors:
      - getEndpointExecutionRole
      - getCloudTrailEvents
