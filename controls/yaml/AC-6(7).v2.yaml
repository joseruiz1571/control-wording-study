version: "0.1.0"
description: "Control-wording study variant AC-6(7).v2"
controls:
  - id: "AC-6(7).v2"
    framework: "SP 800-53 Rev 5"
    pattern: sufficiency
    intent: >
      (a) Review the privileges assigned to [Assignment: organization-defined roles or classes of users] [Assignment: organization-defined frequency] in order to validate the need for such privileges; and (b) If necessary, reassign or remove privileges so they correctly reflect organizational mission and business needs.
    collectors:
      - getEndpointExecutionRole
