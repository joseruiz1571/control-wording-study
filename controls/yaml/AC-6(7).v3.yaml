version: "0.1.0"
description: "Control-wording study variant AC-6(7).v3"
controls:
  - id: "AC-6(7).v3"
    framework: "SP 800-53 Rev 5"
    pattern: sufficiency
    intent: >
      (a) Validate the need for privileges by reviewing, [Assignment: organization-defined frequency], the privileges assigned to [Assignment: organization-defined roles or classes of users]; and (b) Reassign or remove privileges, if necessary, to correctly reflect organizational mission and business needs.
    collectors:
      - getEndpointExecutionRole
