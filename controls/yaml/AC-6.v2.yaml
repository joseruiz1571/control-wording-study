version: "0.1.0"
description: "Control-wording study variant AC-6.v2"
controls:
  - id: "AC-6.v2"
    framework: "SP 800-53 Rev 5"
    pattern: sufficiency
    intent: >
      Users (or processes acting on behalf of users) are allowed only those authorized accesses necessary to accomplish assigned organizational tasks, employing the principle of least privilege.
    collectors:
      - getEndpointExecutionRole
