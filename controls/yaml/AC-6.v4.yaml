version: "0.1.0"
description: "Control-wording study variant AC-6.v4"
controls:
  - id: "AC-6.v4"
    framework: "SP 800-53 Rev 5"
    pattern: sufficiency
    intent: >
      Limit authorized accesses for users (or processes acting on behalf of users) to those necessary to accomplish assigned organizational tasks, employing the principle of least privilege.
    collectors:
      - getEndpointExecutionRole
