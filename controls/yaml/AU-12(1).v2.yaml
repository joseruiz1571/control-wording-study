version: "0.1.0"
description: "Control-wording study variant AU-12(1).v2"
controls:
  - id: "AU-12(1).v2"
    framework: "SP 800-53 Rev 5"
    pattern: correlation
    intent: >
      Audit records from [Assignment: organization-defined system components] are compiled into a system-wide (logical or physical) audit trail time-correlated to within [Assignment: organization-defined level of tolerance for the relationship between time stamps of individual records in the audit trail].
    collectors:
      - getCloudTrailEvents
      - getModelRegistryEntry
