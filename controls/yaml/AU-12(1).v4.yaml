version: "0.1.0"
description: "Control-wording study variant AU-12(1).v4"
controls:
  - id: "AU-12(1).v4"
    framework: "SP 800-53 Rev 5"
    pattern: correlation
    intent: >
      Form a system-wide (logical or physical) audit trail by compiling audit records from [Assignment: organization-defined system components], time-correlated to within [Assignment: organization-defined level of tolerance for the relationship between time stamps of individual records in the audit trail].
    collectors:
      - getCloudTrailEvents
      - getModelRegistryEntry
