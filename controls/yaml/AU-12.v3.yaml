version: "0.1.0"
description: "Control-wording study variant AU-12.v3"
controls:
  - id: "AU-12.v3"
    framework: "SP 800-53 Rev 5"
    pattern: sufficiency
    intent: >
      a. Supply audit record generation capability for the event types the system is capable of auditing as defined in AU-2a on [Assignment: organization-defined system components]; b. [Assignment: organization-defined personnel or roles] are allowed to select the event types that are to be logged by specific components of the system; and c. Audit records are generated for the event types defined in AU-2c and include the audit record content defined in AU-3.
    collectors:
      - getCloudTrailEvents
