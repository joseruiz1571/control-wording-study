version: "0.1.0"
description: "Control-wording study variant AU-2.v3"
controls:
  - id: "AU-2.v3"
    framework: "SP 800-53 Rev 5"
    pattern: sufficiency
    intent: >
      a. Identify the types of events that the system is capable of logging in support of the audit function: [Assignment: organization-defined event types that the system is capable of logging]; b. Coordinate the event logging function with other organizational entities requiring audit-related information so as to guide and inform selection criteria for events to be logged; c. Within the system, specify the following event types for logging: [Assignment: organization-defined event types (subset of the event types defined in AU-2a.) along with the frequency of (or situation requiring) logging for each identified event type]; d. Give a rationale that the event types selected for logging are deemed to be adequate to support after-the-fact investigations of incidents; and e. At [Assignment: organization-defined frequency], review and update the event types selected for logging.
    collectors:
      - getCloudTrailEvents
