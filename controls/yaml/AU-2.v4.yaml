version: "0.1.0"
description: "Control-wording study variant AU-2.v4"
controls:
  - id: "AU-2.v4"
    framework: "SP 800-53 Rev 5"
    pattern: sufficiency
    intent: >
      a. Identify the types of events that the system is capable of logging in support of the audit function: [Assignment: organization-defined event types that the system is capable of logging]; b. Coordinate the event logging function with other organizational entities requiring audit-related information to guide and inform the selection criteria for events to be logged; c. Specify the following event types for logging within the system: [Assignment: organization-defined event types (subset of the event types defined in AU-2a.) along with the frequency of (or situation requiring) logging for each identified event type]; d. Provide a rationale for why the selected logging event types are deemed to be adequate to support after-the-fact incident investigations; and e. Review and update the event types selected for logging [Assignment: organization-defined frequency].
    collectors:
      - getCloudTrailEvents
