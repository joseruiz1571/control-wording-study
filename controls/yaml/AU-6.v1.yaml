version: "0.1.0"
description: "Control-wording study variant AU-6.v1"
controls:
  - id: "AU-6.v1"
    framework: "SP 800-53 Rev 5"
    pattern: synthesis
    intent: >
      a. Review and analyze system audit records [Assignment: organization-defined frequency] looking for indications of [Assignment: organization-defined inappropriate or unusual activity] and for the potential impact of that inappropriate or unusual activity; b. Report findings to [Assignment: organization-defined personnel or roles]; and c. Adjust the level of audit record review, analysis, and reporting within the system when risk changes based on law enforcement information, intelligence information, or other credible sources of information.
    collectors:
      - getCloudTrailEvents
      - getModelMonitorSchedules
