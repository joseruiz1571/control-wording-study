version: "0.1.0"
description: "Control-wording study variant AU-6.v3"
controls:
  - id: "AU-6.v3"
    framework: "SP 800-53 Rev 5"
    pattern: synthesis
    intent: >
      a. Examine and analyze system audit records [Assignment: organization-defined frequency] for indications of [Assignment: organization-defined inappropriate or unusual activity] and the potential impact of the inappropriate or unusual activity; b. Communicate findings to [Assignment: organization-defined personnel or roles]; and c. Adjust the level of audit record review, analysis, and reporting within the system when there is a change in risk based on law enforcement information, intelligence information, or other credible sources of information.
    collectors:
      - getCloudTrailEvents
      - getModelMonitorSchedules
