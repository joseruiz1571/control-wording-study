version: "0.1.0"
description: "Control-wording study variant AU-8.v3"
controls:
  - id: "AU-8.v3"
    framework: "SP 800-53 Rev 5"
    pattern: sufficiency
    intent: >
      a. Use internal system clocks to produce time stamps for audit records; and b. Record, for audit records, time stamps meeting [Assignment: organization-defined granularity of time measurement] that use Coordinated Universal Time, have a fixed local time offset from Coordinated Universal Time, or that include the local time offset as part of the time stamp.
    collectors:
      - getCloudTrailEvents
