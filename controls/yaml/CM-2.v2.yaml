version: "0.1.0"
description: "Control-wording study variant CM-2.v2"
controls:
  - id: "CM-2.v2"
    framework: "SP 800-53 Rev 5"
    pattern: synthesis
    intent: >
      a. A current baseline configuration of the system is developed, documented, and maintained under configuration control; and b. The baseline configuration of the system is reviewed and updated: 1. [Assignment: organization-defined frequency]; 2. When required due to [Assignment: organization-defined circumstances]; and 3. When system components are installed or upgraded.
    collectors:
      - getModelRegistryEntry
      - getEndpointConfig
