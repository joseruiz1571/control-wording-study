version: "0.1.0"
description: "Control-wording study variant CM-2.v3"
controls:
  - id: "CM-2.v3"
    framework: "SP 800-53 Rev 5"
    pattern: synthesis
    intent: >
      a. Develop, document, and maintain a current system baseline configuration under configuration control; and b. Review and update that baseline configuration: 1. [Assignment: organization-defined frequency]; 2. When required due to [Assignment: organization-defined circumstances]; and 3. When system components are installed or upgraded.
    collectors:
      - getModelRegistryEntry
      - getEndpointConfig
