version: "0.1.0"
description: "Control-wording study variant CM-3(1).v2"
controls:
  - id: "CM-3(1).v2"
    framework: "SP 800-53 Rev 5"
    pattern: correlation
    intent: >
      Using [Assignment: organization-defined automated mechanisms]: (a) Document proposed changes to the system; (b) Notify [Assignment: organization-defined approval authorities] of proposed system changes and request change approval; (c) Highlight proposed system changes not approved or disapproved within [Assignment: organization-defined time period]; (d) Prohibit changes to the system until designated approvals are received; (e) Document all changes to the system; and (f) Notify [Assignment: organization-defined personnel] when approved system changes are completed.
    collectors:
      - getCloudTrailEvents
      - getModelRegistryEntry
