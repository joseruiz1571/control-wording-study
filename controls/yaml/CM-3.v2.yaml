version: "0.1.0"
description: "Control-wording study variant CM-3.v2"
controls:
  - id: "CM-3.v2"
    framework: "SP 800-53 Rev 5"
    pattern: correlation
    intent: >
      a. Identify and document the types of system changes that are configuration-controlled; b. Review proposed configuration-controlled changes to the system and, with explicit consideration for security and privacy impact analyses, approve or disapprove such changes; c. Record configuration change decisions associated with the system; d. Put approved configuration-controlled changes to the system into effect; e. Keep records of configuration-controlled changes to the system for [Assignment: organization-defined time period]; f. Monitor and review activities associated with configuration-controlled changes to the system; and g. Coordinate and oversee configuration change control activities through [Assignment: organization-defined configuration change control element] that convenes [Selection (one or more): [Assignment: organization-defined frequency]; when [Assignment: organization-defined configuration change conditions]].
    collectors:
      - getCloudTrailEvents
      - getModelRegistryEntry
