version: "0.1.0"
description: "Control-wording study variant CM-7(1).v2"
controls:
  - id: "CM-7(1).v2"
    framework: "SP 800-53 Rev 5"
    pattern: synthesis
    intent: >
      (a) Review the system [Assignment: organization-defined frequency] in order to identify functions, ports, protocols, software, and services that are unnecessary and/or nonsecure; and (b) Disable or remove [Assignment: organization-defined functions, ports, protocols, software, and services within the system deemed to be unnecessary and/or nonsecure].
    collectors:
      - getEndpointConfig
      - getEndpointExecutionRole
      - getEndpointNetworkConfig
