version: "0.1.0"
description: "Control-wording study variant CM-7(1).v4"
controls:
  - id: "CM-7(1).v4"
    framework: "SP 800-53 Rev 5"
    pattern: synthesis
    intent: >
      (a) Review the system [Assignment: organization-defined frequency] to identify unnecessary and/or nonsecure functions, ports, protocols, software, and services; and (b) [Assignment: organization-defined functions, ports, protocols, software, and services within the system deemed to be unnecessary and/or nonsecure] are disabled or removed.
    collectors:
      - getEndpointConfig
      - getEndpointExecutionRole
      - getEndpointNetworkConfig
