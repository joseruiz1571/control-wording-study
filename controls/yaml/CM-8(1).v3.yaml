version: "0.1.0"
description: "Control-wording study variant CM-8(1).v3"
controls:
  - id: "CM-8(1).v3"
    framework: "SP 800-53 Rev 5"
    pattern: correlation
    intent: >
      When components are installed or removed and when the system is updated, update the inventory of system components.
    collectors:
      - getModelRegistryEntry
      - getCloudTrailEvents
