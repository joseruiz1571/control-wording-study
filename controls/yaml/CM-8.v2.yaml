version: "0.1.0"
description: "Control-wording study variant CM-8.v2"
controls:
  - id: "CM-8.v2"
    framework: "SP 800-53 Rev 5"
    pattern: synthesis
    intent: >
      a. Develop and document an inventory of system components that: 1. Accurately reflects the system; 2. Includes all components within the system; 3. Does not include duplicate accounting of components or of components assigned to any other system; 4. Uses the granularity deemed necessary for tracking and reporting; and 5. Includes the following information to achieve system component accountability: [Assignment: organization-defined information deemed necessary to achieve effective system component accountability]; and b. At [Assignment: organization-defined frequency], review and update the system component inventory.
    collectors:
      - getModelRegistryEntry
      - getEndpointConfig
