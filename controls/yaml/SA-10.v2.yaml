version: "0.1.0"
description: "Control-wording study variant SA-10.v2"
controls:
  - id: "SA-10.v2"
    framework: "SP 800-53 Rev 5"
    pattern: correlation
    intent: >
      The developer of the system, system component, or system service is required to: a. Perform configuration management during system, component, or service [Selection (one or more): design; development; implementation; operation; disposal]; b. Document, manage, and control the integrity of changes to [Assignment: organization-defined configuration items under configuration management]; c. Implement only organization-approved changes to the system, component, or service; d. Document approved changes to the system, component, or service and the potential security and privacy impacts of such changes; and e. Track security flaws and flaw resolution within the system, component, or service and report findings to [Assignment: organization-defined personnel].
    collectors:
      - getCloudTrailEvents
      - getModelRegistryEntry
