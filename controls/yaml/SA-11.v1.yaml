version: "0.1.0"
description: "Control-wording study variant SA-11.v1"
controls:
  - id: "SA-11.v1"
    framework: "SP 800-53 Rev 5"
    pattern: sufficiency
    intent: >
      At all post-design stages of the system development life cycle, require the developer of the system, system component, or system service to: a. Develop and implement a plan for ongoing security and privacy control assessments; b. Perform [Selection (one or more): unit; integration; system; regression] testing/evaluation [Assignment: organization-defined frequency] at [Assignment: organization-defined depth and coverage]; c. Produce evidence of the execution of the assessment plan and the results of the testing and evaluation; d. Implement a verifiable flaw remediation process; and e. Correct flaws identified during testing and evaluation.
    collectors:
      - getModelMonitorSchedules
