version: "0.1.0"
description: "Control-wording study variant SA-11.v3"
controls:
  - id: "SA-11.v3"
    framework: "SP 800-53 Rev 5"
    pattern: sufficiency
    intent: >
      Require the developer of the system, system component, or system service, at all post-design stages of the system development life cycle, to: a. Create and put into effect a plan for ongoing security and privacy control assessments; b. Perform [Selection (one or more): unit; integration; system; regression] testing/evaluation [Assignment: organization-defined frequency] at [Assignment: organization-defined depth and coverage]; c. Produce evidence that the assessment plan was executed and of the results of the testing and evaluation; d. Implement a verifiable flaw remediation process; and e. Correct flaws identified during testing and evaluation.
    collectors:
      - getModelMonitorSchedules
