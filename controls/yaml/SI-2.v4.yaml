version: "0.1.0"
description: "Control-wording study variant SI-2.v4"
controls:
  - id: "SI-2.v4"
    framework: "SP 800-53 Rev 5"
    pattern: correlation
    intent: >
      a. Identify, report, and correct system flaws; b. Test, for effectiveness and potential side effects, software and firmware updates related to flaw remediation before installation; c. Install security-relevant software and firmware updates within [Assignment: organization-defined time period] of the release of the updates; and d. Fold flaw remediation into the organizational configuration management process.
    collectors:
      - getCloudTrailEvents
      - getModelRegistryEntry
