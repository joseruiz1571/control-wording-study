version: "0.1.0"
description: "Control-wording study variant SI-4.v1"
controls:
  - id: "SI-4.v1"
    framework: "SP 800-53 Rev 5"
    pattern: synthesis
    intent: >
      The system is monitored in order to detect: 1. Attacks and indicators of potential attacks in accordance with the following monitoring objectives: [Assignment: organization-defined monitoring objectives]; and 2. Unauthorized local, network, and remote connections. Unauthorized use of the system is identified through the following techniques and methods: [Assignment: organization-defined techniques and methods]. Internal monitoring capabilities are invoked or monitoring devices are deployed: 1. Strategically within the system to collect organization-determined essential information; and 2. At ad hoc locations within the system to track specific types of transactions of interest to the organization. Detected events and anomalies are analyzed. The level of system monitoring activity is adjusted when there is a change in risk to organizational operations and assets, individuals, other organizations, or the Nation. A legal opinion is obtained regarding system monitoring activities. [Assignment: organization-defined system monitoring information] is provided to [Assignment: organization-defined personnel or roles] [Selection (one or more): as needed; [Assignment: organization-defined frequency]].
    collectors:
      - getDataCaptureConfig
      - getModelMonitorSchedules
      - getEndpointNetworkConfig
