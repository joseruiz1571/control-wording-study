version: "0.1.0"
description: "Control-wording study variant SI-4.v2"
controls:
  - id: "SI-4.v2"
    framework: "SP 800-53 Rev 5"
    pattern: synthesis
    intent: >
      a. Detect, by monitoring the system: 1. Attacks and indicators of potential attacks in accordance with the following monitoring objectives: [Assignment: organization-defined monitoring objectives]; and 2. Unauthorized local, network, and remote connections; b. Identify unauthorized use of the system through the following techniques and methods: [Assignment: organization-defined techniques and methods]; c. Invoke internal monitoring capabilities or deploy monitoring devices: 1. Strategically within the system to collect organization-determined essential information; and 2. At ad hoc locations within the system to track specific types of transactions of interest to the organization; d. Analyze detected events and anomalies; e. When there is a change in risk to organizational operations and assets, individuals, other organizations, or the Nation, adjust the level of system monitoring activity; f. Obtain legal opinion regarding system monitoring activities; and g. Provide [Assignment: organization-defined system monitoring information] to [Assignment: organization-defined personnel or roles] [Selection (one or more): as needed; [Assignment: organization-defined frequency]].
    collectors:
      - getDataCaptureConfig
      - getModelMonitorSchedules
      - getEndpointNetworkConfig
