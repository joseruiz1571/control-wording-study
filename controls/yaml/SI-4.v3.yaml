version: "0.1.0"
description: "Control-wording study variant SI-4.v3"
controls:
  - id: "SI-4.v3"
    framework: "SP 800-53 Rev 5"
    pattern: synthesis
    intent: >
      a. Monitor the system to detect: 1. Attacks and indicators of potential attacks in accordance with the following monitoring objectives: [Assignment: organization-defined monitoring objectives]; and 2. Unauthorized local, network, and remote connections; b. Through the following techniques and methods, identify unauthorized use of the system: [Assignment: organization-defined techniques and methods]; c. Invoke internal monitoring capabilities or deploy monitoring devices: 1. Strategically within the system to collect organization-determined essential information; and 2. At ad hoc locations within the system to track specific types of transactions of interest to the organization; d. Analyze events and anomalies that are detected; e. Adjust the level of system monitoring activity when there is a change in risk to organizational operations and assets, individuals, other organizations, or the Nation; f. Obtain legal opinion regarding system monitoring activities; and g. Provide [Assignment: organization-defined system monitoring information] to [Assignment: organization-defined personnel or roles] [Selection (one or more): as needed; [Assignment: organization-defined frequency]].
    collectors:
      - getDataCaptureConfig
      - getModelMonitorSchedules
      - getEndpointNetworkConfig
