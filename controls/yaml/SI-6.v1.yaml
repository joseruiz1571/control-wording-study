version: "0.1.0"
description: "Control-wording study variant SI-6.v1"
controls:
  - id: "SI-6.v1"
    framework: "SP 800-53 Rev 5"
    pattern: synthesis
    intent: >
      a. Verify correct operation of [Assignment: organization-defined security and privacy functions]; b. Perform the verification of the functions specified in SI-6a [Selection (one or more): [Assignment: organization-defined system transitional states]; upon command by user with appropriate privilege; [Assignment: organization-defined frequency]]; c. Alert [Assignment: organization-defined personnel or roles] to failed security and privacy verification tests; and d. [Selection (one or more): Shut the system down; Restart the system; [Assignment: organization-defined alternative action(s)]] when anomalies are discovered.
    collectors:
      - getModelMonitorSchedules
      - getDataCaptureConfig
