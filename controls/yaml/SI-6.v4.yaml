version: "0.1.0"
description: "Control-wording study variant SI-6.v4"
controls:
  - id: "SI-6.v4"
    framework: "SP 800-53 Rev 5"
    pattern: synthesis
    intent: >
      a. Verify the correct operation of [Assignment: organization-defined security and privacy functions]; b. The verification of the functions specified in SI-6a is performed [Selection (one or more): [Assignment: organization-defined system transitional states]; upon command by user with appropriate privilege; [Assignment: organization-defined frequency]]; c. [Assignment: organization-defined personnel or roles] are alerted to failed security and privacy verification tests; and d. [Selection (one or more): Shut the system down; Restart the system; [Assignment: organization-defined alternative action(s)]] when anomalies are discovered.
    collectors:
      - getModelMonitorSchedules
      - getDataCaptureConfig
