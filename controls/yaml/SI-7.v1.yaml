version: "0.1.0"
description: "Control-wording study variant SI-7.v1"
controls:
  - id: "SI-7.v1"
    framework: "SP 800-53 Rev 5"
    pattern: correlation
    intent: >
      a. Use integrity verification tools to detect unauthorized changes to the following software, firmware, and information: [Assignment: organization-defined software, firmware, and information]; and b. Take the following actions when unauthorized changes to the software, firmware, and information are detected: [Assignment: organization-defined actions].
    collectors:
      - getModelRegistryEntry
      - getCloudTrailEvents
