version: "0.1.0"
description: "Control-wording study variant AU-8.r3"
controls:
  - id: "AU-8.r3"
    framework: "SP 800-53 Rev 5"
    pattern: sufficiency
    intent: >
      a. Use internal system clocks to produce time stamps for audit records; and b. Record, for audit records, those time stamps meeting [Assignment: organization-defined granularity of time measurement] that satisfy one or more of the following: use Coordinated Universal Time; have a fixed local time offset from Coordinated Universal Time; include the local time offset as part of the time stamp.
    collectors:
      - getCloudTrailEvents
