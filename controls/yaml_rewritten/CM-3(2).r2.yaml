version: "0.1.0"
description: "Control-wording study variant CM-3(2).r2"
controls:
  - id: "CM-3(2).r2"
    framework: "SP 800-53 Rev 5"
    pattern: correlation
    intent: >
      a. Changes to the system are tested before finalizing the implementation of the changes; b. Changes to the system are validated before finalizing the implementation of the changes; and c. Changes to the system are documented before finalizing the implementation of the changes.
    collectors:
      - getCloudTrailEvents
      - getModelRegistryEntry
