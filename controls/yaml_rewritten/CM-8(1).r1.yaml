version: "0.1.0"
description: "Control-wording study variant CM-8(1).r1"
controls:
  - id: "CM-8(1).r1"
    framework: "SP 800-53 Rev 5"
    pattern: correlation
    intent: >
      When any of the following occur — component installations; component removals; and system updates — update the inventory of system components.
    collectors:
      - getModelRegistryEntry
      - getCloudTrailEvents
