version: "0.1.0"
description: "Control-wording study variant CM-8(1).r2"
controls:
  - id: "CM-8(1).r2"
    framework: "SP 800-53 Rev 5"
    pattern: correlation
    intent: >
      The inventory of system components is updated when any of the following occur: component installations; component removals; and system updates.
    collectors:
      - getModelRegistryEntry
      - getCloudTrailEvents
