version: "0.1.0"
description: "Control-wording study variant SA-4(8).r0"
controls:
  - id: "SA-4(8).r0"
    framework: "SP 800-53 Rev 5"
    pattern: sufficiency
    intent: >
      Require the developer of the system, system component, or system service to produce a plan for continuous monitoring of control effectiveness; that plan is consistent with the continuous monitoring program of the organization.
    collectors:
      - getModelMonitorSchedules
