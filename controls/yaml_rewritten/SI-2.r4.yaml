version: "0.1.0"
description: "Control-wording study variant SI-2.r4"
controls:
  - id: "SI-2.r4"
    framework: "SP 800-53 Rev 5"
    pattern: correlation
    intent: >
      a. Identify system flaws; report system flaws; and correct system flaws; b. Test, for effectiveness, software and firmware updates related to flaw remediation before installation; and test, for potential side effects, those updates before installation; c. Install security-relevant software and firmware updates within [Assignment: organization-defined time period] of the release of the updates; and d. Fold flaw remediation into the organizational configuration management process.
    collectors:
      - getCloudTrailEvents
      - getModelRegistryEntry
